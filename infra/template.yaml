AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  PawPal+ -- the full app on AWS serverless. One public origin (CloudFront at
  the site's domain): the React build from a private S3 bucket by default,
  /api/* to an HTTP API in front of one Python Lambda running the FastAPI app,
  data in one DynamoDB table. No VPC, no NAT, no always-on server.

Parameters:
  DomainName:
    Type: String
    Default: pawpal.manushri.dev
    Description: The site's public hostname (a CNAME to the CloudFront distribution).
  CertificateArn:
    Type: String
    AllowedPattern: "arn:aws:acm:us-east-1:[0-9]{12}:certificate/.+"
    Description: ACM certificate for DomainName, in us-east-1 (infra/certificate.yaml).
  OwnerKeyParameterName:
    Type: String
    Default: /pawpal/prod/owner-key
    Description: SecureString SSM parameter holding PAWPAL_OWNER_KEY.
  AnthropicKeyParameterName:
    Type: String
    Default: /pawpal/prod/anthropic-api-key
    Description: >
      SecureString SSM parameter holding the owner space's Anthropic API key.
      May be absent: the owner space then uses the free rule-based model.
  OriginVerifyParameterName:
    Type: String
    Default: /pawpal/prod/origin-verify
    Description: >
      String SSM parameter holding the secret CloudFront adds to API requests.
      A plain String because CloudFront header values can only resolve those.
  ClaudeModel:
    Type: String
    Default: claude-haiku-4-5
  FunctionMemoryMB:
    Type: Number
    Default: 1024
    MinValue: 512
    MaxValue: 3008
  ReservedConcurrency:
    Type: Number
    Default: 0
    MinValue: 0
    Description: >
      Cap on concurrent executions (bounds worst-case spend). 0 leaves it
      unset -- needed on accounts whose concurrency quota is still the
      new-account default of 10, where nothing can be reserved.
  ApiRateLimit:
    Type: Number
    Default: 10
    Description: Steady-state requests per second across the API.
  ApiBurstLimit:
    Type: Number
    Default: 20
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90]

Conditions:
  ReserveConcurrency: !Not [!Equals [!Ref ReservedConcurrency, 0]]

Globals:
  Function:
    Runtime: python3.13
    Architectures: [x86_64]

Resources:
  # -- data ---------------------------------------------------------------------
  DataTable:
    Type: AWS::DynamoDB::Table
    # The owner space lives here and is not rebuildable: never let a stack
    # update or delete take the table with it.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-data"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      # Demo sandbox items carry expires_at (epoch seconds); DynamoDB deletes
      # them after it passes. Owner-space items have no expires_at.
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      DeletionProtectionEnabled: true
      SSESpecification:
        SSEEnabled: true

  # -- API ------------------------------------------------------------------------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # Throttling bounds what any burst -- a bot, a runaway client -- can cost.
      DefaultRouteSettings:
        ThrottlingBurstLimit: !Ref ApiBurstLimit
        ThrottlingRateLimit: !Ref ApiRateLimit
      # CloudFront is the only intended caller; api/origin.py refuses anything
      # else. The execute-api endpoint must stay enabled for CloudFront to use it.
      DisableExecuteApiEndpoint: false

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-api"
      RetentionInDays: !Ref LogRetentionDays

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-api"
      Description: PawPal+ FastAPI app (every /api route) via Mangum.
      CodeUri: ../build/lambda-src
      Handler: api.lambda_handler.handler
      MemorySize: !Ref FunctionMemoryMB
      # API Gateway HTTP APIs give an integration 30 seconds; the function
      # stops just before, so a slow request fails as a Lambda timeout the
      # logs name, not as a gateway 503 with nothing behind it.
      Timeout: 29
      ReservedConcurrentExecutions: !If [ReserveConcurrency, !Ref ReservedConcurrency, !Ref "AWS::NoValue"]
      LoggingConfig:
        LogGroup: !Ref ApiLogGroup
        LogFormat: Text
      Environment:
        Variables:
          PAWPAL_STORAGE_BACKEND: dynamodb
          PAWPAL_DYNAMODB_TABLE: !Ref DataTable
          PAWPAL_COOKIE_SECURE: "1"
          PAWPAL_DEMO_TTL_HOURS: "48"
          PAWPAL_LOG_DESTINATION: stdout
          # Claude is used only in the owner space (api/deps.py); demo
          # visitors always get the free rule-based model.
          PAWPAL_LLM_PROVIDER: claude
          PAWPAL_MODEL: !Ref ClaudeModel
          # Worst case per extraction: 2 attempts x 13 s, no SDK retries --
          # inside the 29 s function timeout.
          PAWPAL_MAX_ATTEMPTS: "2"
          PAWPAL_LLM_TIMEOUT_SECONDS: "13"
          PAWPAL_LLM_MAX_RETRIES: "0"
          # tests/test_lambda_handler.py::TestPayloadBudget: 4 MB is the largest
          # upload whose base64 event fits Lambda's 6 MB invoke payload.
          PAWPAL_MAX_UPLOAD_BYTES: "4194304"
          # pawpal_ai/documents.py::max_document_chars: keeps one document's
          # extraction and every later Ask well inside the 30 s limit.
          PAWPAL_MAX_DOCUMENT_CHARS: "200000"
          # Secret *names* only; values are read at cold start (api/secrets.py).
          PAWPAL_OWNER_KEY_PARAMETER: !Ref OwnerKeyParameterName
          ANTHROPIC_API_KEY_PARAMETER: !Ref AnthropicKeyParameterName
          PAWPAL_ORIGIN_VERIFY_PARAMETER: !Ref OriginVerifyParameterName
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: OwnDataTable
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:BatchWriteItem
                - dynamodb:ConditionCheckItem
              Resource: !GetAtt DataTable.Arn
            - Sid: ReadOwnSecrets
              Effect: Allow
              Action: ssm:GetParameters
              Resource:
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${OwnerKeyParameterName}"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AnthropicKeyParameterName}"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${OriginVerifyParameterName}"
            - Sid: DecryptSecureStringsViaSsm
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"
      Events:
        # The $default route: everything that reaches the HTTP API goes to the
        # app, which answers unknown paths with a JSON 404. CloudFront decides
        # which paths reach the API at all.
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi

  # -- frontend -------------------------------------------------------------------
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-frontend-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFrontReadsObjects
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
          # Lets a missing file answer 404 rather than S3's default 403.
          - Sid: CloudFrontListsForAccurate404s
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:ListBucket
            Resource: !GetAtt FrontendBucket.Arn
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-frontend-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-spa-rewrite"
      AutoPublish: true
      FunctionConfig:
        Comment: Serve index.html for client-side routes (/app, /app/health, ...).
        Runtime: cloudfront-js-2.0
      # Attached only to the default (S3) behavior, so /api/* is never touched.
      # A path whose last segment has a file extension is a real file (hashed
      # bundle, favicon) and passes through -- a missing one stays a 404
      # instead of turning into the app. Anything else is a route of the SPA.
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          var lastSegment = uri.substring(uri.lastIndexOf('/') + 1);
          if (lastSegment.indexOf('.') === -1) {
            request.uri = '/index.html';
          }
          return request;
        }

  StaticCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-static"
        Comment: Honour the object's own Cache-Control (immutable bundles, no-cache index.html).
        # MinTTL 0 is what lets index.html's "no-cache" mean no caching.
        MinTTL: 0
        DefaultTTL: 86400
        MaxTTL: 31536000
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: PawPal+
        Enabled: true
        Aliases: [!Ref DomainName]
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: frontend
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: api
            DomainName: !Sub "${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
            OriginCustomHeaders:
              - HeaderName: X-PawPal-Origin-Verify
                HeaderValue: !Sub "{{resolve:ssm:${OriginVerifyParameterName}}}"
        DefaultCacheBehavior:
          TargetOriginId: frontend
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: !Ref StaticCachePolicy
          # Managed "SecurityHeadersPolicy": HSTS, nosniff, frame and referrer policy.
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewriteFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            Compress: true
            # Managed "CachingDisabled": every API response is per-visitor.
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            # Managed "AllViewerExceptHostHeader": the session cookie, the
            # X-PawPal-Owner-Key and X-PawPal-Client-Now headers, and query
            # strings all reach the API; Host becomes the API's own.
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          - PathPattern: /api
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03

Outputs:
  SiteUrl:
    Value: !Sub "https://${DomainName}"
  DistributionId:
    Value: !Ref Distribution
  DistributionDomainName:
    Description: Point the DomainName CNAME here.
    Value: !GetAtt Distribution.DomainName
  FrontendBucketName:
    Value: !Ref FrontendBucket
  ApiFunctionName:
    Value: !Ref ApiFunction
  HttpApiEndpoint:
    Description: Direct API Gateway URL -- refuses requests that did not come through CloudFront.
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  DataTableName:
    Value: !Ref DataTable
