# Continuous integration for PawPal+.
#
# Three independent jobs -- one per build system, plus the artifact that ships:
#   backend   the pytest suite, installed from requirements-dev.txt
#   frontend  oxlint, then `npm run build` (which type-checks via `tsc -b`)
#   docker    builds the production image and smoke-tests a running container,
#             including the one failure no unit test can see: data surviving the
#             container being replaced.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # No frontend/dist exists in this job, so the app runs in its API-only
      # serving mode here; tests/test_spa_serving.py covers the built-SPA path
      # against a fake dist in tmp_path.
      - name: Run pytest
        run: pytest -q

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t pawpal:ci .

      - name: Start a container on an empty volume
        run: |
          docker run -d --name pawpal -p 8000:8000 -v pawpal-ci-data:/app/data pawpal:ci
          for _ in $(seq 1 30); do
            curl -fsS "$BASE/api/healthz" && exit 0
            sleep 1
          done
          echo "container never became healthy" >&2
          exit 1

      - name: Smoke-test the running app
        run: |
          status() { curl -s -o /dev/null -w '%{http_code}' "$@"; }

          # The SPA is served, including on a client-side deep link.
          curl -fsS "$BASE/health" | grep -q '<div id="root">'

          # An unknown /api path stays a JSON 404 instead of falling back to index.html.
          test "$(status "$BASE/api/does-not-exist")" = 404

          # With no PAWPAL_OWNER_KEY configured, the LLM-calling endpoints fail closed.
          test "$(status -X POST "$BASE/api/health/pets/any/ask" \
            -H 'content-type: application/json' -d '{"question": "hi"}')" = 503

          # Test tooling stays out of the runtime image.
          if docker exec pawpal python -c "import pytest" 2>/dev/null; then
            echo "pytest is installed in the production image" >&2
            exit 1
          fi

          # A first boot on an empty volume says so, loudly.
          docker logs pawpal 2>&1 | grep -q "starting with a new, empty database"

      - name: Data survives the container being replaced
        run: |
          # Each visitor's data lives in their own demo session, identified by
          # a cookie -- so the "same visitor" after the restart is the same
          # cookie jar.
          curl -fsS -c jar -b jar "$BASE/api/session"
          curl -fsS -c jar -b jar -X POST "$BASE/api/pets" -H 'content-type: application/json' \
            -d '{"name": "Persistence Check", "pet_type": "dog", "age": 1}'

          docker rm -f pawpal
          docker run -d --name pawpal -p 8000:8000 -v pawpal-ci-data:/app/data pawpal:ci
          for _ in $(seq 1 30); do
            curl -fsS "$BASE/api/healthz" > /dev/null && break
            sleep 1
          done

          curl -fsS -b jar "$BASE/api/pets" | grep -q "Persistence Check"
          # ...and a different visitor does not see it.
          if curl -fsS "$BASE/api/pets" | grep -q "Persistence Check"; then
            echo "a second visitor can see the first visitor's pet" >&2
            exit 1
          fi

          # ...and booting onto existing data must not claim the database is new.
          if docker logs pawpal 2>&1 | grep -q "starting with a new, empty database"; then
            echo "fresh-database warning fired on a volume that already had data" >&2
            exit 1
          fi

      - name: Container logs
        if: always()
        run: docker logs pawpal || true
