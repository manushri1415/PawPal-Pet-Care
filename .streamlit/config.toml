# PawPal+ theme — warm & cozy, grounded palette (sand / ink / terracotta).
# Matches the "Mockup A" dashboard concept: deeper, less-pastel tones than the
# generic soft sage/terracotta/cream that reads as AI-generated by default,
# a restrained (not uniformly-pill-rounded) corner radius, and a deliberate
# serif/grotesque type pairing instead of Inter/Roboto defaults.

[theme]
base = "light"

primaryColor = "#B14A2C"
backgroundColor = "#EAE0CD"
secondaryBackgroundColor = "#E2D5BC"
textColor = "#2B2117"
borderColor = "#D9CBB0"
linkColor = "#B14A2C"

font = "Work Sans:https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800&display=swap"
headingFont = "Lora:https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&display=swap"

baseRadius = "6px"
buttonRadius = "8px"
showWidgetBorder = true
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#E2D5BC"
